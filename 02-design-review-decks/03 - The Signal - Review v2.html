<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<title>The Signal — Review v2 · Mentis</title>
<link rel="stylesheet" href="brand/colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Inter', sans-serif; color: #0F2237; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#1A3A5C">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1A3A5C"/>
    <g stroke="#F2F6FB" stroke-width="3" fill="none" opacity="0.9">
      <path d="M 200 400 Q 400 200 600 400 T 1000 400"/>
      <path d="M 200 440 Q 400 260 600 440 T 1000 440" opacity="0.6"/>
      <path d="M 200 360 Q 400 140 600 360 T 1000 360" opacity="0.6"/>
    </g>
    <circle cx="600" cy="400" r="12" fill="#D4980F"/>
    <text x="600" y="600" text-anchor="middle" font-family="serif" font-style="italic" font-size="72" fill="#F2F6FB">The Signal</text>
  </svg>
</template>
<div id="root"></div>

<script src="data/guests.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/SignalBrand.jsx"></script>
<script type="text/babel" src="components/GuestPackCover.jsx"></script>
<script type="text/babel" src="components/ThreeThemesSpread.jsx"></script>
<script type="text/babel" src="components/SocialCards.jsx"></script>

<script type="text/babel">
const GUESTS = window.GUESTS;
const KAMAAL = GUESTS.kammal; // data key unchanged for stability; display uses correct 'Kamaal'
const KEVIN = GUESTS.kevin;

// ───────────────────────────────────────────────────────────
// Helper: a full guest review row — cover + themes spread +
// the four social cards. Reused for Kamaal and Kevin.
// ───────────────────────────────────────────────────────────
function GuestReviewRow({ guest, index, draft, notes }) {
  const guestLabel = `${guest.name} · Episode ${guest.episode}`;
  return (
    <>
      {/* Row intro — guest identification strip */}
      <div style={{
        padding: '0 60px 20px', marginTop: 40,
        display: 'flex', alignItems: 'center', gap: 20,
      }}>
        <div style={{
          fontFamily: 'Fraunces, serif', fontStyle: 'italic', fontWeight: 400,
          fontSize: 20, color: '#D4980F',
        }}>№</div>
        <div style={{
          fontFamily: 'Fraunces, serif', fontWeight: 600, fontSize: 40,
          color: '#1A3A5C', letterSpacing: '-0.02em', lineHeight: 1,
        }}>{String(index).padStart(2, '0')}</div>
        <div style={{ width: 36, height: 1.5, background: '#D4980F' }} />
        <div>
          <div style={{
            fontFamily: 'Fraunces, serif', fontWeight: 600,
            fontSize: 28, letterSpacing: '-0.015em', color: '#1A1110', lineHeight: 1.1,
          }}>{guest.name}</div>
          <div style={{
            fontSize: 12, letterSpacing: '0.2em', textTransform: 'uppercase',
            color: 'rgba(40,30,20,0.55)', fontWeight: 500, marginTop: 6,
          }}>Episode {guest.episode} · {guest.role} · {guest.agency}</div>
        </div>
        {draft && (
          <div style={{
            marginLeft: 'auto',
            padding: '6px 12px',
            background: 'rgba(212,152,15,0.12)',
            border: '1px solid rgba(212,152,15,0.4)',
            fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase',
            color: '#8c5f00', fontWeight: 600,
          }}>Draft themes · awaiting confirmation</div>
        )}
      </div>

      {/* 02 — Guest Pack cover */}
      <DCSection
        title={`${String(index).padStart(2, '0')}A · Guest Pack · Cover — ${guest.name}`}
        subtitle="A4 portrait. Deep Space Blue masthead over the guest plate. Real headshot, real copy."
      >
        <DCArtboard label={`Cover · A4 · ${guest.name}`} width={794} height={1123}>
          <GuestPackCover guest={guest} />
        </DCArtboard>

        <div style={{ position: 'relative', width: 320 }}>
          {notes.cover.map((n, i) => (
            <DCPostIt key={i} top={40 + i * 260} left={20} width={280}
                      rotate={i % 2 === 0 ? -1.5 : 1.2}>
              <strong>{n.title}</strong>
              <div style={{ marginTop: 8 }} dangerouslySetInnerHTML={{ __html: n.body }} />
            </DCPostIt>
          ))}
        </div>
      </DCSection>

      {/* 02B — Themes spread */}
      <DCSection
        title={`${String(index).padStart(2, '0')}B · Guest Pack · Three Themes spread — ${guest.name}`}
        subtitle={draft
          ? 'Two A4 pages shown together. Themes to review before sending.'
          : 'Two A4 pages. The themes are built from the real brief — they are ready to send.'}
      >
        <DCArtboard label={`Spread · Pages 06–07 · ${guest.name}`} width={1588} height={1123}>
          <ThreeThemesSpread guest={guest} />
        </DCArtboard>

        <div style={{ position: 'relative', width: 320 }}>
          {notes.spread.map((n, i) => (
            <DCPostIt key={i} top={40 + i * 280} left={20} width={280}
                      rotate={i % 2 === 0 ? 1.5 : -1.2}>
              <strong>{n.title}</strong>
              <div style={{ marginTop: 8 }} dangerouslySetInnerHTML={{ __html: n.body }} />
            </DCPostIt>
          ))}
        </div>
      </DCSection>

      {/* 02C — Social set */}
      <DCSection
        title={`${String(index).padStart(2, '0')}C · Promo pack — ${guest.name}`}
        subtitle="Four formats, one DNA. Pull-quote is the social quote from the brief; swap at will."
      >
        <DCArtboard label="LinkedIn · 1200×627" width={1200} height={627}>
          <SocialLinkedIn guest={guest} />
        </DCArtboard>

        <DCArtboard label="Instagram square · 1080×1080" width={1080} height={1080}>
          <SocialIGSquare guest={guest} />
        </DCArtboard>

        <DCArtboard label="Instagram story · 1080×1920" width={540} height={960}
                    style={{ background: 'transparent' }}>
          <div style={{ width: 1080, height: 1920, transform: 'scale(0.5)', transformOrigin: '0 0' }}>
            <SocialIGStory guest={guest} />
          </div>
        </DCArtboard>

        <DCArtboard label="16:9 clip thumbnail · 1920×1080" width={1280} height={720}
                    style={{ background: 'transparent' }}>
          <div style={{ width: 1920, height: 1080, transform: 'scale(0.6666)', transformOrigin: '0 0' }}>
            <SocialClip16x9 guest={guest} />
          </div>
        </DCArtboard>
      </DCSection>
    </>
  );
}

// Per-guest post-it notes — the designer's margin notes to Trisden
const KAMAAL_NOTES = {
  cover: [
    { title: 'Name corrected — Kamaal, double-a.',
      body: 'The first pass had &ldquo;Kammal&rdquo;. His LinkedIn, his last-name badge, and the record all say <strong>Kamaal Watkins</strong>. Fixed across every artefact. Worth double-checking your CRM too.' },
    { title: 'Role updated — not an MD.',
      body: 'Kamaal wound down TRNSPRNT in late 2025 and moved to <strong>Randstad Enterprise, supporting Google</strong>. The cover reflects that. It is also the most interesting part of his story — see the themes.' },
    { title: 'Footer = guarantee.',
      body: '&ldquo;Nothing is by accident.&rdquo; appears on every cover, every social card, every spread. It is the single line the brand is built around.' },
  ],
  spread: [
    { title: 'Theme order re-sequenced.',
      body: '&ldquo;Going out and coming back&rdquo; is now <strong>Theme 01</strong> — it is the rarest thing he has to say, and the one the episode title gets built around. Decade, enterprise, transparency follow.' },
    { title: 'Added: agency-to-enterprise theme.',
      body: 'Replaced the old Transatlantic theme. The move from Apollo (agency desk) to Randstad/Google (enterprise seat) is more current, more specific, and he has lived it in the last six months. Transatlantic was a guess; this is fact.' },
    { title: 'Vertical range widened.',
      body: 'His real path is SAP → NetSuite → Azure → Forensic → Google. The first pass overstated forensic. The spread now frames it honestly: a decade across ERP, cloud, forensic, and enterprise staffing.' },
  ],
};

const KEVIN_NOTES = {
  cover: [
    { title: 'Same cover system, different guest.',
      body: 'Kevin\'s cover is identical machinery to Kamaal\'s. Eight fields swapped. Zero bespoke work — the whole point of the template.' },
    { title: 'Photo: the LinkedIn headshot.',
      body: 'Kevin\'s LinkedIn headshot has warmth and reads well at the plate size. Corner marks and a light desat put him in the same visual world as Kamaal. Duotone is still on the table as a series-wide move.' },
    { title: 'Career-years line is real.',
      body: '&ldquo;5+ in recruitment · 10+ in sales&rdquo; — because that is what he is. Five years in estate agency before recruitment is his story, not a footnote. The metadata block on the cover tells that truth.' },
  ],
  spread: [
    { title: 'Themes are out of DRAFT.',
      body: 'After reading his full profile + About section, I can write these with confidence. Every framing paragraph is final-pass, not placeholder. You can still edit in the 15-min call, but the spread is sendable as-is.' },
    { title: 'Three themes — dropped the estate-agent arc.',
      body: 'Per your note, we\'re leaving the estate-agency-to-recruiter story out. The spread now runs <strong>Global Markets → Managed Services → Two paths with Kamaal</strong>. Cleaner, and keeps him firmly in the seat he holds now.' },
    { title: 'Theme 03 is the two-hander.',
      body: '&ldquo;Two paths, one industry — you and Kamaal.&rdquo; The reason both episodes exist in the same week. Enterprise vs agency, Global Markets vs professional services. This is what gives the listener a reason to hear both.' },
  ],
};

function App() {
  return (
    <DesignCanvas>
      {/* Intro header */}
      <div style={{ padding: '0 60px 48px', maxWidth: 1200 }}>
        <div style={{
          fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase',
          color: 'rgba(40,30,20,0.55)', fontWeight: 500, marginBottom: 10,
        }}>Mentis Digital · Review pack v2 · 19 April 2026 · evening</div>
        <div style={{
          fontFamily: 'Fraunces, serif', fontWeight: 600,
          fontSize: 52, lineHeight: 1.02, letterSpacing: '-0.025em',
          color: '#1A1110', marginBottom: 20, maxWidth: 1000,
        }}>
          The Signal — <span style={{ fontStyle: 'italic', fontWeight: 500 }}>Kamaal &amp; Kevin, v2.</span>
        </div>
        <div style={{
          fontFamily: 'Inter, sans-serif', fontSize: 15, lineHeight: 1.6,
          color: 'rgba(40,30,20,0.8)', maxWidth: 760, textWrap: 'pretty',
        }}>
          Second pass, now driven by <strong>verified LinkedIn data</strong> for both
          guests. The first version had Kamaal's name misspelled and his role
          wrong — he pivoted from founder to Randstad/Google in late 2025.
          Kevin's themes have been rewritten from his full profile; the DRAFT
          tag is gone. Both packs are sendable. Everything downstream is
          template-driven, so a single edit in{' '}
          <code style={{ background: 'rgba(40,30,20,0.06)', padding: '1px 6px', borderRadius: 3 }}>data/guests.js</code>{' '}
          flows through every artefact.
        </div>

        {/* Status strip */}
        <div style={{
          marginTop: 32, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16,
          maxWidth: 820,
        }}>
          <StatusCard
            guest="Kamaal Watkins"
            episode="007"
            status="Ready to send · v2"
            tone="go"
            detail="Name corrected. Role updated to Randstad/Google. Themes re-sequenced around the agency→founder→enterprise arc."
          />
          <StatusCard
            guest="Kevin Oti"
            episode="008"
            status="Ready to send · v2"
            tone="go"
            detail="Three themes, rewritten from verified profile: Global Markets, Managed Services, and the two-hander with Kamaal."
          />
        </div>
      </div>

      {/* 01 — Sub-brand plate (shared, compact) */}
      <DCSection
        title="01 · Sub-brand plate"
        subtitle="Unchanged from the first pass — included for context. Wordmark, motif, Mentis lock-up."
      >
        <DCArtboard label="Wordmark · on Deep Space Blue" width={420} height={280}>
          <div style={{
            width: '100%', height: '100%', background: '#1A3A5C',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <SignalWordmark size={1.4} color="#F2F6FB" accent="#D4980F" />
          </div>
        </DCArtboard>

        <DCArtboard label="Signature motif · layered frequency" width={660} height={280}>
          <div style={{
            width: '100%', height: '100%', background: '#1A3A5C',
            padding: 24, boxSizing: 'border-box',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <SignalMotif width={612} height={230} color="#F2F6FB" accent="#D4980F" lineCount={9} />
          </div>
        </DCArtboard>

        <DCArtboard label="Lock-up · alongside Mentis" width={420} height={280}>
          <div style={{
            width: '100%', height: '100%', background: '#F2F6FB',
            padding: 36, boxSizing: 'border-box',
            display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
          }}>
            <SignalWordmarkInline color="#1A3A5C" accent="#D4980F" size={1.1} />
            <div style={{ height: 1, background: 'rgba(138,171,200,0.5)', margin: '20px 0' }} />
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <img src="brand/logo/mono-navy.svg" alt="Mentis" style={{ height: 24 }} />
              <span style={{
                fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase',
                color: '#1A3A5C', opacity: 0.65, fontWeight: 500,
              }}>A Mentis Podcast</span>
            </div>
          </div>
        </DCArtboard>
      </DCSection>

      {/* 02 — Kamaal */}
      <GuestReviewRow guest={KAMAAL} index={2} draft={false} notes={KAMAAL_NOTES} />

      {/* 03 — Kevin */}
      <GuestReviewRow guest={KEVIN} index={3} draft={false} notes={KEVIN_NOTES} />

      {/* 04 — Next steps */}
      <DCSection
        title="04 · What I need from you"
        subtitle="Two decisions and one brief — then we ship both packs."
      >
        <DCArtboard label="Decisions" width={760} height={560}>
          <div style={{
            width: '100%', height: '100%', background: '#F2F6FB',
            padding: 44, boxSizing: 'border-box',
            fontFamily: 'Inter, sans-serif', color: '#0F2237',
          }}>
            <div style={{
              fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase',
              color: '#1A3A5C', fontWeight: 500, marginBottom: 20,
            }}>Decision points</div>
            <ol style={{ paddingLeft: 22, margin: 0, lineHeight: 1.55, fontSize: 14 }}>
              <li style={{ marginBottom: 16 }}>
                <strong>Kamaal — sign off on the re-sequenced themes.</strong>{' '}
                &ldquo;Going out and coming back&rdquo; is now Theme 01.
                &ldquo;Agency-to-enterprise&rdquo; replaces the old
                Transatlantic theme. If either feels wrong, flag it and I'll
                revise.
              </li>
              <li style={{ marginBottom: 16 }}>
                <strong>Kevin — confirm the three-theme spread.</strong>{' '}
                Estate-agent-to-recruiter is out, per your note. The spread
                now runs Global Markets → Managed Services → the two-hander
                with Kamaal. If any of those feel off, flag and I\'ll adjust.
              </li>
              <li style={{ marginBottom: 16 }}>
                <strong>Photo treatment — duotone or natural?</strong>{' '}
                Currently: full colour, slight desat. Across a series of
                15+ guests, a consistent duotone (deep + alice) will feel
                more editorial. Your call.
              </li>
              <li style={{ marginBottom: 16 }}>
                <strong>Pull-quote source.</strong>{' '}
                Each guest now has a <code>quote</code> field in{' '}
                <code>data/guests.js</code>. I picked one from the tone of
                the brief. Happy to swap to a different line from the
                recording once we have it.
              </li>
              <li style={{ marginBottom: 16 }}>
                <strong>Then: full pack build.</strong>{' '}
                Once these are locked, I'll produce the remaining 10 pack
                sections (Why we asked, Conversation shape, Logistics,
                Release form, Laws of The Signal in full) for both guests.
                Two days.
              </li>
            </ol>
          </div>
        </DCArtboard>

        <div style={{ position: 'relative', width: 320 }}>
          <DCPostIt top={40} left={20} width={280} rotate={-1.5}>
            <strong>What changed since v1.</strong>
            <div style={{ marginTop: 8 }}>
              Name: <strong>Kamaal</strong>, not Kammal. Role: Randstad/Google,
              not MD. Themes: re-sequenced, one replaced. Kevin: out of DRAFT,
              estate-agent arc added as Theme 01.
            </div>
          </DCPostIt>
          <DCPostIt top={260} left={20} width={280} rotate={1}>
            <strong>Why it matters.</strong>
            <div style={{ marginTop: 8 }}>
              Sending a pack that calls someone by the wrong name or role is
              the fastest way to lose a guest in the first 30 seconds. This
              pass is the one we can actually send.
            </div>
          </DCPostIt>
        </div>
      </DCSection>
    </DesignCanvas>
  );
}

function StatusCard({ guest, episode, status, tone, detail }) {
  const isGo = tone === 'go';
  return (
    <div style={{
      background: '#F2F6FB',
      borderLeft: `3px solid ${isGo ? '#1A3A5C' : '#D4980F'}`,
      padding: '16px 20px',
      fontFamily: 'Inter, sans-serif',
    }}>
      <div style={{
        display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
        marginBottom: 6,
      }}>
        <div style={{
          fontFamily: 'Fraunces, serif', fontWeight: 600, fontSize: 18,
          color: '#1A1110', letterSpacing: '-0.015em',
        }}>{guest}</div>
        <div style={{
          fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase',
          color: '#1A3A5C', opacity: 0.65, fontWeight: 500,
        }}>Ep {episode}</div>
      </div>
      <div style={{
        fontSize: 11, letterSpacing: '0.2em', textTransform: 'uppercase',
        color: isGo ? '#1A3A5C' : '#8c5f00', fontWeight: 600, marginBottom: 6,
      }}>{status}</div>
      <div style={{
        fontSize: 13, color: '#0F2237', opacity: 0.8, lineHeight: 1.5,
      }}>{detail}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
